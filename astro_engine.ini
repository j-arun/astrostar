[system]
engine_name = Astro Engine D1 Monthly Transit & Multi-LLM Reasoning System
version = 2.0.0
default_provider = local_qwen

[provider_local_qwen]
name = Local Qwen 2.5 14B (Ollama)
model = qwen2.5:14b-instruct
endpoint = http://localhost:11434/api/generate
temperature = 0.3
max_tokens = 1024
streaming = false

[provider_gemini]
name = Google Gemini Pro
model = gemini-3.1-pro-preview
temperature = 0.2
max_tokens = 1500

[provider_claude]
name = Anthropic Claude
model = claude-3-5-sonnet-20241022
temperature = 0.2
max_tokens = 1500

[speech_synthesis]
default_rate = 1.0
default_pitch = 1.0
voice_preference = Google UK English Male, Daniel, en-US
